[build]
  command = "mkdir -p public && cp index.html public/index.html"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[dev]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
